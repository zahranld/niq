<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ملف محمي — الإدارة العملية للفئات</title>
<style>
:root{--shelf:#12324a;--tag:#f5c518;--alert:#c8472d;--ink:#1b2733;--paper:#fbfcfd;--line:#d9e0e7;box-sizing:border-box;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--shelf);color:var(--ink);font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--paper);width:100%;max-width:400px;border-radius:10px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.top{background:var(--tag);padding:18px 22px}
.top small{display:block;font-size:13px;opacity:.75}
.top h1{margin:4px 0 0;font-size:21px;line-height:1.5}
form{padding:22px}
label{display:block;font-weight:600;margin-bottom:8px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;font-size:17px;padding:10px 12px;border:1.5px solid var(--line);border-radius:6px;direction:ltr;text-align:left}
input:focus{outline:3px solid var(--tag);outline-offset:1px;border-color:var(--shelf)}
.eye{font:inherit;font-size:14px;border:1.5px solid var(--line);background:#fff;border-radius:6px;padding:0 12px;cursor:pointer;color:var(--ink)}
button.go{margin-top:14px;width:100%;font:inherit;font-weight:700;font-size:17px;background:var(--shelf);color:#fff;border:0;border-radius:6px;padding:12px;cursor:pointer}
button.go:disabled{opacity:.6;cursor:wait}
.msg{min-height:24px;margin-top:10px;font-size:14.5px;color:var(--alert);font-weight:600}
.note{font-size:13px;color:#56636f;margin:6px 0 0}
</style>
</head>
<body>
<div class="card">
  <div class="top"><small>قسم التدريب والتطوير — زهران ماركت</small><h1>الإدارة العملية للفئات<br>الشرح الشامل</h1></div>
  <form id="f" autocomplete="off">
    <label for="pw">كلمة المرور</label>
    <div class="row"><input id="pw" type="password" required autofocus><button type="button" class="eye" id="eye" aria-label="إظهار كلمة المرور">إظهار</button></div>
    <button class="go" id="go" type="submit">فتح الملف</button>
    <div class="msg" id="msg" role="alert" aria-live="assertive"></div>
    <p class="note">المحتوى مشفّر بالكامل ولا يظهر إلا بكلمة المرور الصحيحة.</p>
  </form>
</div>

    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(D.i)},key,u8(D.c));
    var html=new TextDecoder().decode(pt);
    document.open();document.write(html);document.close();
  }catch(err){
    msg.textContent='كلمة المرور غير صحيحة.';go.disabled=false;go.textContent='فتح الملف';pw.select();
  }
});
